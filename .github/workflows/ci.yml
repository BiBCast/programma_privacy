name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installa il progetto
        run: python -m pip install -e ".[dev]"

      - name: Controllo stile
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
