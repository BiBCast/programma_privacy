# Parole e frasi che indicano categorie particolari di dati (art. 9 GDPR) o dati giudiziari
# (art. 10). Il programma non le maschera: le segnala in revisione e decide l'utente.
#
# Come si scrivono:
# - minuscole e maiuscole sono equivalenti, tranne per le sigle scritte tutte maiuscole
#   (CGIL, RSU…), che si cercano così come sono per non confondere "usb" con la porta USB;
# - l'asterisco finale accetta qualunque desinenza: "malatti*" trova malattia e malattie;
# - le parole di una frase possono essere separate da uno o più spazi.
#
# Elenco base curato dal responsabile del programma. Ogni utente può aggiungere le sue parole
# dalla finestra degli elenchi personali.
#
# BOZZA del 27/10/2026: le voci estese vanno riviste da chi conosce i documenti (consulente del
# lavoro, ufficio legale, DPO). Restano fuori apposta le parole troppo ambigue: "lega" (anche
# lega metallica), "PD" (anche la provincia di Padova), "cristian*" (anche un nome proprio),
# "farmac*" (anche "farmacia"), "ereditari*" (anche "beni ereditari" nelle successioni).

